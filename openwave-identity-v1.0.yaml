openapi: 3.0.3

info:
  title: OpenWave — Identity & Alias Registry API
  description: |
    # OpenWave Identity API v1.1

    The OpenWave Identity Registry is the global, open-source identity layer for the
    OpenWave payment network. It is currently operated by **Neptune Fintech** under a
    published open governance charter, with the explicit intent to transfer stewardship
    to a neutral body — such as the **Central Bank of Libya** or a bank consortium —
    as the network matures.

    The source code for the registry is open source. Any organisation can audit it,
    fork it, or propose governance changes.

    ---

    ## What is an NPT Handle?

    **NPT** stands for **National Payment Tag**.

    An **NPT Handle** is a global payment identity in the format `username` or
    `username@bank-handle`.

    - `mtellesy` — resolves to the user's **default** linked account
    - `mtellesy@andalus` — resolves specifically to the user's Andalus account
    - `mtellesy@nub` — resolves to the user's NUB account

    A single person owns the username. They can link accounts from multiple banks.
    The `@bank-handle` suffix routes to a specific account; omitting it uses the default.

    ---

    ## Key Principles

    - **The registry stores routing only** — no KYC data, no transaction history,
      no balances. Only: `username → { bank, iban, is_default }`.
    - **Banks vouch for users** — a user claims a handle through their bank, which
      has already KYC-verified them. The registry trusts the bank's assertion.
    - **User controls their identity** — users can link/unlink accounts and change
      their default through any of their linked banks.
    - **Resolution is public and fast** — the `/identity/resolve` endpoint requires
      no authentication and is designed to be cached by gateways.
    - **First-come, first-served** — handles are unique globally. Disputes are
      resolved through the registered bank.
    - **Names are never reissued** — when a customer renames, the previous handle
      is permanently retired. It never redirects to, or reveals, the replacement.

    ---

    ## Identity Lifecycle

    ```
    1. User registers handle via their bank
       POST /identity/claim  (bank-initiated, bank-signed)
       ← { npt_handle: "mtellesy", status: "ACTIVE" }

    2. User links a second bank account
       POST /identity/mtellesy/accounts  (second bank-initiated)
       ← { bank_handle: "nub", iban: "LY27...", is_default: false }

    3. User sets NUB as default
       PATCH /identity/mtellesy/default
       ← { default_account: "nub" }

    4. Sender pays "mtellesy" → resolves to NUB account
       GET /identity/resolve?alias=mtellesy
       ← { iban: "LY27...", bank_handle: "nub", display_name: "Mohamed T." }

    5. Sender pays "mtellesy@andalus" → resolves to Andalus account regardless of default
       GET /identity/resolve?alias=mtellesy@andalus
       ← { iban: "LY83...", bank_handle: "andalus", display_name: "Mohamed T." }
    ```

    ---

    ## Authentication

    | Context | Header | Used by |
    |---|---|---|
    | Bank → Registry | `X-OpenWave-Bank-Key: {key}` | Banks claiming/linking/unlinking |
    | Registry Admin | `X-OpenWave-Registry-Key: {key}` | Neptune / future CBL admin |
    | Resolution | None (public, rate-limited) | Gateways, anyone |

    ---

    ## Amounts
    This API contains no monetary amounts. All resolution responses return IBANs
    for use by the calling gateway's payment flow.

    ---

    ## Governance

    The registry is governed by the **OpenWave Identity Charter** (see GOVERNANCE.md
    in the openwave-spec repository). Key commitments:

    - Registry operator publishes all code as open source (Apache 2.0)
    - No bank is denied registration without published justification
    - Handle disputes follow a documented arbitration process
    - Stewardship transfer to CBL or bank consortium is a stated goal

  version: "1.1.0"
  contact:
    name: Neptune Fintech — OpenWave Registry
    url: https://www.neptune.ly
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

externalDocs:
  description: OpenWave Standard Repository
  url: https://github.com/neptune-ly/openwave-spec

servers:
  - url: https://registry.openwave.ly/v1
    description: OpenWave Identity Registry (operated by Neptune Fintech)
  - url: https://{registry_host}/v1
    description: Self-hosted or future CBL-operated registry
    variables:
      registry_host:
        default: registry.openwave.ly
        description: Registry host

tags:
  - name: Resolution
    description: Alias resolution — public, used by gateways and payment apps
  - name: Identity
    description: Identity profile management
  - name: Authentication
    description: Customer portal sign-in and linked-bank approval
  - name: Accounts
    description: Link and manage bank accounts under an identity
  - name: Banks
    description: Bank handle registry — maps bank-handle to core endpoint
  - name: KYC
    description: Bank-authenticated cross-bank identity deduplication
  - name: Registry
    description: Registry metadata and governance info

# =============================================================================
# PATHS
# =============================================================================

paths:

  # ---------------------------------------------------------------------------
  # RESOLUTION — Public, no auth, rate-limited
  # ---------------------------------------------------------------------------

  /identity/resolve:
    get:
      tags: [Resolution]
      summary: Resolve an NPT alias to an IBAN
      description: |
        Resolves an NPT alias to the target bank account IBAN and bank handle.
        This is the primary endpoint called by OpenWave gateways during payment routing.

        **Alias formats accepted:**
        - `mtellesy` — resolves to the user's default account
        - `mtellesy@andalus` — resolves to the user's Andalus-linked account specifically

        This endpoint is **public** (no authentication required) and is designed to be
        fast and cacheable. Rate limiting applies per calling IP.

        **Cache guidance:** responses may be cached for up to 60 seconds. Gateways
        should re-resolve on cache miss or payment failure.
      operationId: resolveAlias
      security: []
      parameters:
        - name: alias
          in: query
          required: true
          description: NPT alias to resolve (`username` or `username@bank-handle`)
          schema:
            type: string
            example: mtellesy@andalus
        - name: purpose
          in: query
          required: false
          description: Optional hint for audit logging (`payment`, `verification`, `display`)
          schema:
            type: string
            enum: [payment, verification, display]
            default: payment
      responses:
        "200":
          description: Alias resolved successfully
          headers:
            Cache-Control:
              schema:
                type: string
                example: max-age=60
            X-OpenWave-Registry-Version:
              schema:
                type: string
                example: "1.1.0"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AliasResolution'
              example:
                npt_handle: mtellesy
                bank_handle: andalus
                iban: LY83002700100099900001
                display_name: Mohamed T.
                account_type: CURRENT
                is_default: true
                resolved_at: "2026-04-24T00:00:00Z"
        "404":
          description: Handle not found or account not linked to requested bank
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: IDENTITY_NOT_FOUND
                message: No identity found for handle 'mtellesy@xyz'
        "410":
          description: The base handle was retired permanently and cannot be resolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandleRetiredErrorResponse'
              example:
                code: HANDLE_RETIRED
                message: The name 'old.handle' is no longer in use.
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "503":
          description: Registry temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ---------------------------------------------------------------------------
  # IDENTITY — Claim and profile
  # ---------------------------------------------------------------------------

  /identity/handles/{handle}/availability:
    get:
      tags: [Identity]
      summary: Check whether an NPT handle can be claimed
      description: |
        Returns a typed availability verdict before a claim or rename is attempted.

        - `AVAILABLE` — the normalized handle can be claimed now.
        - `TAKEN` — a live or retained identity already owns the handle.
        - `RETIRED` — the handle was used previously and is reserved permanently.
        - `INVALID` — the candidate does not match the NPT handle format.

        A registry or network failure is not an availability verdict. Clients must
        report the dependency failure and must not treat it as `AVAILABLE`.
      operationId: getHandleAvailability
      security:
        - BankKey: []
      parameters:
        - $ref: '#/components/parameters/HandleCandidate'
      responses:
        "200":
          description: Availability verdict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandleAvailabilityResponse'
              examples:
                available:
                  value:
                    handle: ahmed.ali
                    status: AVAILABLE
                    available: true
                retired:
                  value:
                    handle: old.handle
                    status: RETIRED
                    available: false
        "403":
          description: Missing or invalid bank authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /identity/claim:
    post:
      tags: [Identity]
      summary: Claim an NPT handle (bank-initiated)
      description: |
        Called by a bank to claim an NPT handle on behalf of a KYC-verified customer.
        The bank vouches that the customer is verified and owns the linked IBAN.

        - If the handle is already claimed by a different bank-verified identity, returns 409.
        - If the handle is already claimed by the same identity (re-claim), returns the
          existing identity.
        - The claimed IBAN automatically becomes the **default account**.

        Only registered OpenWave banks may call this endpoint.
      operationId: claimHandle
      security:
        - BankKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimHandleRequest'
            example:
              npt_handle: mtellesy
              bank_handle: andalus
              iban: LY83002700100099900001
              customer_display_name: Mohamed T.
              bank_customer_ref: CUST-00012345
              set_as_default: true
      responses:
        "201":
          description: Handle claimed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityProfile'
        "200":
          description: Handle already claimed by this identity (idempotent re-claim)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityProfile'
        "409":
          description: Handle already claimed by a different identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandleTakenErrorResponse'
              example:
                code: HANDLE_TAKEN
                message: The handle 'mtellesy' is already claimed
        "410":
          description: Handle was used previously and is retired permanently
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandleRetiredErrorResponse'
              example:
                code: HANDLE_RETIRED
                message: The name 'old.handle' is no longer in use.
        "422":
          description: Invalid handle format or IBAN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /identity/{npt_handle}:
    get:
      tags: [Identity]
      summary: Get identity profile
      description: |
        Returns a privacy-minimized profile for an NPT handle — linked bank handles
        and whether a default is set. **IBANs are never returned in this profile.**
        Full IBAN is only returned via `/identity/resolve`.
      operationId: getIdentity
      security:
        - BankKey: []
      parameters:
        - $ref: '#/components/parameters/NptHandle'
      responses:
        "200":
          description: Identity profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityPublicProfile'
        "404":
          description: Identity not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags: [Identity]
      summary: Deactivate an identity without releasing its handle
      description: |
        Marks the identity as deleted so it no longer resolves. The handle remains
        reserved and never becomes `AVAILABLE`; retained account-link records may be
        kept for audit, recovery, and governance purposes.

        Can only be called by a bank that has at least one account linked to this
        identity. This operation is not a handle-release mechanism.
      operationId: deleteIdentity
      security:
        - BankKey: []
      parameters:
        - $ref: '#/components/parameters/NptHandle'
      responses:
        "204":
          description: Identity deleted
        "403":
          description: Calling bank has no linked account for this identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: Identity not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /identity/{npt_handle}/handle:
    patch:
      tags: [Identity]
      summary: Rename a customer's NPT handle
      description: |
        Moves an active identity to a new handle. The previous handle is retired
        permanently in the same transaction: it cannot be claimed or used as a
        future rename target, and resolution returns `410 HANDLE_RETIRED` without
        redirecting to or disclosing the replacement.

        The caller must be a registered bank with a linked account for the customer,
        and the supplied 12-digit national ID must match the identity. Renames have a
        30-day cooldown and a lifetime cap of three successful changes. Renaming to
        the normalized handle already owned by the identity is an idempotent no-op
        and does not consume an allowance.

        A changed rename also moves the customer portal username, rejects portal
        sessions issued to the old username, and revokes OAuth tokens and grants
        whose subject is the old username. The customer must sign in again with
        the new handle and grant fresh consent to each delegated application.
        A same-name retry changes no subject and therefore omits the three
        rename-only fields in the response.
      operationId: renameHandle
      security:
        - BankKey: []
      parameters:
        - $ref: '#/components/parameters/NptHandle'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameHandleRequest'
            example:
              newHandle: ahmed.ali
              nationalId: "123456789012"
      responses:
        "200":
          description: Identity renamed, or same-name retry accepted as a no-op
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityRenameResponse'
              examples:
                renamed:
                  value:
                    nptHandle: ahmed.ali
                    displayName: Ahmed Ali
                    status: ACTIVE
                    defaultBankHandle: andalus
                    linkedBanks: [andalus, nub]
                    nationalIdPresent: true
                    customerPortalAccess: null
                    createdAt: "2026-07-01T10:00:00Z"
                    updatedAt: "2026-08-08T11:00:00Z"
                    retiredHandle: ahmed
                    reauthenticationRequired: true
                    nextStep: Customer must sign in again with 'ahmed.ali' and re-authorize delegated apps.
        "400":
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandleValidationErrorResponse'
              example:
                code: VALIDATION_ERROR
                message: "new_handle: Handle must be 3-32 lowercase alphanumeric characters, dots, underscores, or hyphens"
        "403":
          description: Bank does not serve this identity, national ID does not match, or identity is inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandleRenameNotPermittedErrorResponse'
              example:
                code: HANDLE_RENAME_NOT_PERMITTED
                message: National ID does not match the identity being renamed.
        "404":
          description: Current identity or calling bank was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandleRenameNotFoundErrorResponse'
        "409":
          description: The requested new handle is owned by a current identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandleTakenErrorResponse'
              example:
                code: HANDLE_TAKEN
                message: The handle 'salma' is already claimed
        "410":
          description: The requested new handle was retired and will never become available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandleRetiredErrorResponse'
              example:
                code: HANDLE_RETIRED
                message: The name 'old.handle' is no longer in use.
        "429":
          description: The 30-day cooldown or lifetime limit of three renames was reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandleRenameTooSoonErrorResponse'
              example:
                code: HANDLE_RENAME_TOO_SOON
                message: A name can be changed once every 30 days.

  # ---------------------------------------------------------------------------
  # AUTHENTICATION — Customer bank-app sign-in approval
  # ---------------------------------------------------------------------------

  /auth/login:
    post:
      tags: [Authentication]
      summary: Start a portal sign-in
      description: |
        Customer sign-in accepts the OpenWave portal password with the global NPT
        username, phone number, or national ID. A phone or national-ID sign-in does
        not collect a bank password, PIN, OTP, or passcode. Instead it returns a
        five-minute `BANK_APP` challenge and the customer's linked-bank choices.

        The client selects one linked bank (the default may be presented first) and
        hands the challenge to that bank's trusted app. The bank authenticates its
        own customer locally and calls the bank-authenticated approval endpoint with
        its internal `customerRef`. Identity never receives the bank credential.
      operationId: loginToIdentityPortal
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PortalLoginRequest'
            example:
              username: "+218916000020"
              password: customer-portal-password
              role: CUSTOMER
      responses:
        "200":
          description: Sign-in completed without linked-bank approval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalSessionResponse'
        "202":
          description: TOTP verification or linked-bank approval is required
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/TotpLoginChallengeResponse'
                  - $ref: '#/components/schemas/BankAppLoginChallengeResponse'
        "400":
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Portal username or password is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "409":
          description: The requested portal lane does not match the account role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleMismatchResponse'

  /auth/login/totp/verify:
    post:
      tags: [Authentication]
      summary: Verify a portal TOTP login challenge
      description: |
        Completes TOTP for a portal login. For a customer who signed in by phone
        or national ID, successful TOTP verification advances to the same linked-
        bank choice and approval contract; it does not bypass bank approval.
      operationId: verifyPortalTotpLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpLoginVerifyRequest'
      responses:
        "200":
          description: Sign-in completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalSessionResponse'
        "202":
          description: TOTP succeeded and linked-bank approval is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankAppLoginChallengeResponse'
        "400":
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: TOTP challenge or code is invalid or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpLoginErrorResponse'

  /auth/login/bank-approval/{challenge_id}:
    get:
      tags: [Authentication]
      summary: Poll a linked-bank login approval
      description: |
        Poll with the opaque status token returned only to the login initiator.
        `PENDING`, `REJECTED`, and `EXPIRED` return no portal session. An approved
        challenge returns the session while it remains valid. The status token
        is not a bank credential and must not be sent to a bank app.
      operationId: getBankLoginApprovalStatus
      security:
        - LoginStatusToken: []
      parameters:
        - $ref: '#/components/parameters/LoginChallengeId'
        - name: status_token
          in: query
          required: false
          deprecated: true
          description: Compatibility alternative to `X-OpenWave-Login-Status-Token`.
          schema: { type: string }
      responses:
        "200":
          description: Current effective status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankLoginApprovalStatusResponse'
        "403":
          description: Missing or invalid status token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: Challenge not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginApprovalNotFoundErrorResponse'

  /identity/login-approvals:
    get:
      tags: [Authentication]
      summary: List login approvals visible to the calling bank
      description: |
        Returns only challenges for identities with an account linked to the
        authenticated bank. `EXPIRED` is an effective status derived from the
        five-minute challenge expiry and is supported as a filter.
      operationId: listBankLoginApprovals
      security:
        - BankKey: []
        - BankPortalSession: []
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/LoginApprovalStatus'
        - name: search
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        "200":
          description: Bank-scoped approval queue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankLoginApprovalListResponse'
        "400":
          description: Unsupported status filter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginApprovalInvalidFilterErrorResponse'
        "403":
          description: Missing or invalid bank authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /identity/login-approvals/pending:
    get:
      tags: [Authentication]
      summary: List pending approvals for one bank customer
      operationId: listPendingBankLoginApprovals
      security:
        - BankKey: []
        - BankPortalSession: []
      parameters:
        - name: customerRef
          in: query
          required: true
          schema: { type: string }
          description: The authenticated bank's internal customer reference.
      responses:
        "200":
          description: Pending challenges for this bank customer
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BankLoginApprovalQueueItem'
        "400":
          description: Required customer reference is missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: Missing or invalid bank authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /identity/login-approvals/{challenge_id}:
    get:
      tags: [Authentication]
      summary: Get one login approval visible to the calling bank
      operationId: getBankLoginApproval
      security:
        - BankKey: []
        - BankPortalSession: []
      parameters:
        - $ref: '#/components/parameters/LoginChallengeId'
      responses:
        "200":
          description: Bank-scoped approval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankLoginApprovalQueueItem'
        "403":
          description: Missing or invalid bank authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: Challenge does not exist or is not linked to this bank
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginApprovalNotFoundErrorResponse'

  /identity/login-approvals/{challenge_id}/approve:
    post:
      tags: [Authentication]
      summary: Approve a customer portal sign-in from a linked bank
      operationId: approveBankLogin
      security:
        - BankKey: []
        - BankPortalSession: []
      parameters:
        - $ref: '#/components/parameters/LoginChallengeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BankLoginApprovalActionRequest'
      responses:
        "200":
          description: Challenge approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankLoginApprovalActionResponse'
        "400":
          description: Customer reference is missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: Bank customer does not own an account linked to this identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginApprovalNotPermittedErrorResponse'
        "404":
          description: Challenge not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginApprovalNotFoundErrorResponse'
        "409":
          description: Challenge was already approved or rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginApprovalAlreadyActionedErrorResponse'
        "410":
          description: Challenge expired before the bank action
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginApprovalExpiredErrorResponse'

  /identity/login-approvals/{challenge_id}/reject:
    post:
      tags: [Authentication]
      summary: Reject a customer portal sign-in from a linked bank
      operationId: rejectBankLogin
      security:
        - BankKey: []
        - BankPortalSession: []
      parameters:
        - $ref: '#/components/parameters/LoginChallengeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BankLoginApprovalActionRequest'
      responses:
        "200":
          description: Challenge rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankLoginApprovalActionResponse'
        "400":
          description: Customer reference is missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: Bank customer does not own an account linked to this identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginApprovalNotPermittedErrorResponse'
        "404":
          description: Challenge not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginApprovalNotFoundErrorResponse'
        "409":
          description: Challenge was already approved or rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginApprovalAlreadyActionedErrorResponse'
        "410":
          description: Challenge expired before the bank action
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginApprovalExpiredErrorResponse'

  # ---------------------------------------------------------------------------
  # ACCOUNTS — Link/unlink bank accounts under an identity
  # ---------------------------------------------------------------------------

  /identity/{npt_handle}/accounts:
    get:
      tags: [Accounts]
      summary: List linked accounts (bank-authenticated)
      description: |
        Returns all bank accounts linked to this identity. Only a bank that has
        at least one account linked may call this. IBANs are returned masked
        (first 6 + last 4 characters).
      operationId: listLinkedAccounts
      security:
        - BankKey: []
      parameters:
        - $ref: '#/components/parameters/NptHandle'
      responses:
        "200":
          description: List of linked accounts
          content:
            application/json:
              schema:
                type: object
                properties:
                  npt_handle:
                    type: string
                  accounts:
                    type: array
                    items:
                      $ref: '#/components/schemas/LinkedAccount'
        "403":
          description: Calling bank not linked to this identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: Identity not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags: [Accounts]
      summary: Link a new bank account to an existing identity (bank-initiated)
      description: |
        Links an additional bank account to an existing NPT identity. Called by the
        new bank on behalf of their KYC-verified customer.

        The customer must already have a claimed handle. This adds a new `@bank-handle`
        routing option to their existing identity.
      operationId: linkAccount
      security:
        - BankKey: []
      parameters:
        - $ref: '#/components/parameters/NptHandle'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkAccountRequest'
            example:
              bank_handle: nub
              iban: LY27003400200088800002
              bank_customer_ref: NUB-CUST-9988
              set_as_default: false
      responses:
        "201":
          description: Account linked successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkedAccount'
        "409":
          description: This bank already has an account linked to this identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: ACCOUNT_ALREADY_LINKED
                message: A NUB account is already linked to this identity
        "404":
          description: Identity not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /identity/{npt_handle}/accounts/{bank_handle}:
    patch:
      tags: [Accounts]
      summary: Update a linked account (e.g. change IBAN)
      description: |
        Updates the IBAN for a linked account. Only the bank that owns this
        account link may update it (e.g. after an account number change).
      operationId: updateLinkedAccount
      security:
        - BankKey: []
      parameters:
        - $ref: '#/components/parameters/NptHandle'
        - $ref: '#/components/parameters/BankHandle'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                iban:
                  type: string
                  description: New IBAN for this linked account
                  example: LY83002700100099900002
      responses:
        "200":
          description: Account updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkedAccount'
        "403":
          description: Calling bank does not own this account link
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: Identity or linked account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags: [Accounts]
      summary: Unlink a bank account from an identity
      description: |
        Removes a bank account from this identity. Only the bank that owns the
        account link may remove it.

        If the unlinked account was the default and other accounts remain,
        the registry will designate the earliest-linked account as the new default.
        If no accounts remain, the identity is suspended until a new account is linked.
      operationId: unlinkAccount
      security:
        - BankKey: []
      parameters:
        - $ref: '#/components/parameters/NptHandle'
        - $ref: '#/components/parameters/BankHandle'
      responses:
        "204":
          description: Account unlinked
        "403":
          description: Calling bank does not own this account link
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: Identity or linked account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /identity/{npt_handle}/default:
    patch:
      tags: [Accounts]
      summary: Set the default account for an identity
      description: |
        Sets which linked bank account should receive payments when the sender
        uses just `username` with no `@bank-handle`.

        Can be called by any bank that has an account linked to this identity,
        acting on the customer's instruction.
      operationId: setDefaultAccount
      security:
        - BankKey: []
      parameters:
        - $ref: '#/components/parameters/NptHandle'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bank_handle]
              properties:
                bank_handle:
                  type: string
                  description: The bank_handle to set as default
                  example: nub
      responses:
        "200":
          description: Default account updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  npt_handle:
                    type: string
                  default_bank_handle:
                    type: string
                  updated_at:
                    type: string
                    format: date-time
        "404":
          description: Identity or bank account link not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ---------------------------------------------------------------------------
  # BANKS — Bank handle registry (phonebook)
  # ---------------------------------------------------------------------------

  /banks:
    get:
      tags: [Banks]
      summary: List all registered banks
      description: |
        Returns the full list of banks registered with the OpenWave Identity Registry.
        This is the authoritative phonebook of `bank-handle → core endpoint` mappings.

        Gateways should cache this list locally (TTL: 5 minutes) to avoid registry
        dependency during payment routing.

        This endpoint is **public** — no authentication required.
      operationId: listBanks
      security: []
      parameters:
        - name: country
          in: query
          required: false
          schema:
            type: string
            example: LY
          description: Filter by ISO country code
        - name: active_only
          in: query
          required: false
          schema:
            type: boolean
            default: true
          description: Return only active banks
      responses:
        "200":
          description: List of registered banks
          content:
            application/json:
              schema:
                type: object
                properties:
                  banks:
                    type: array
                    items:
                      $ref: '#/components/schemas/BankRegistration'
                  total:
                    type: integer
                  generated_at:
                    type: string
                    format: date-time

    post:
      tags: [Banks]
      summary: Register a new bank (registry admin only)
      description: |
        Registers a new bank with the OpenWave Identity Registry. Once registered,
        the bank receives an `X-OpenWave-Bank-Key` and may begin claiming handles
        for its customers.

        Only the registry operator (Neptune / future CBL) may call this endpoint.
      operationId: registerBank
      security:
        - RegistryAdminKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterBankRequest'
            example:
              bank_handle: andalus
              display_name: Andalus Bank
              country: LY
              core_url: https://api.andalus.ly
              contact_email: openwave@andalus.ly
      responses:
        "201":
          description: Bank registered, API key issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankRegistrationResult'
        "409":
          description: Bank handle already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /banks/{bank_handle}:
    get:
      tags: [Banks]
      summary: Get a specific bank's registration
      operationId: getBank
      security: []
      parameters:
        - $ref: '#/components/parameters/BankHandle'
      responses:
        "200":
          description: Bank registration details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankRegistration'
        "404":
          description: Bank not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    patch:
      tags: [Banks]
      summary: Update bank registration (admin only)
      operationId: updateBank
      security:
        - RegistryAdminKey: []
      parameters:
        - $ref: '#/components/parameters/BankHandle'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                core_url:
                  type: string
                  format: uri
                display_name:
                  type: string
                contact_email:
                  type: string
                  format: email
                active:
                  type: boolean
      responses:
        "200":
          description: Bank updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankRegistration'
        "404":
          description: Bank not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ---------------------------------------------------------------------------
  # KYC — National ID deduplication (bank-authenticated)
  # ---------------------------------------------------------------------------

  /admin/customers/lookup/nid/{national_id}:
    get:
      tags: [KYC]
      summary: Lookup existing NPT handle by national ID
      description: |
        Allows any registered bank to check whether a customer with a given national ID
        already has an NPT handle in the registry (from enrollment at another bank).

        **Purpose — cross-bank identity deduplication:** When Bank B wants to enroll a
        customer that Bank A already enrolled, they use this endpoint to discover the
        existing NPT handle and reuse it, ensuring one person has one global identity.

        **Non-citizen support (future):** When a customer has no national ID, banks
        should use an alternative unique identifier (passport number, resident ID, etc.).
        The system is designed to accommodate this as a future extension.
      operationId: lookupByNationalId
      security:
        - BankKey: []
      parameters:
        - name: national_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Customer found — returns their existing NPT handle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NidLookupResponse'
        '404':
          description: No customer with this national ID is enrolled yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ---------------------------------------------------------------------------
  # REGISTRY — Metadata and governance
  # ---------------------------------------------------------------------------

  /registry/info:
    get:
      tags: [Registry]
      summary: Registry metadata and governance info
      description: |
        Returns information about this registry instance — who operates it,
        the governance charter URL, spec version, and current operator.
        Public, no authentication required.
      operationId: getRegistryInfo
      security: []
      responses:
        "200":
          description: Registry info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistryInfo'
              example:
                spec_version: "1.1.0"
                operator: Neptune Fintech
                operator_url: https://www.neptune.ly
                governance_charter_url: https://github.com/neptune-ly/openwave-spec/blob/main/GOVERNANCE.md
                source_code_url: https://github.com/neptune-ly/openwave-identity
                registered_banks: 4
                active_identities: 12500
                uptime_sla: "99.9%"
                country_scope: LY
                future_operator: Central Bank of Libya (planned)

# =============================================================================
# COMPONENTS
# =============================================================================

components:

  securitySchemes:
    BankKey:
      type: apiKey
      in: header
      name: X-OpenWave-Bank-Key
      description: Issued to registered OpenWave banks by the registry operator
    RegistryAdminKey:
      type: apiKey
      in: header
      name: X-OpenWave-Registry-Key
      description: Issued to the registry operator (Neptune Fintech / future CBL)
    BankPortalSession:
      type: apiKey
      in: header
      name: X-OpenWave-Portal-Session
      description: Authenticated bank-portal session scoped to one bank.
    LoginStatusToken:
      type: apiKey
      in: header
      name: X-OpenWave-Login-Status-Token
      description: Opaque token returned only to the initiator of a bank-app login challenge.

  parameters:
    NptHandle:
      name: npt_handle
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9_.-]{3,32}$'
        example: mtellesy
      description: NPT handle (username only, no @bank suffix)

    HandleCandidate:
      name: handle
      in: path
      required: true
      schema:
        type: string
        example: ahmed.ali
      description: Candidate handle. Invalid candidates return a typed `INVALID` verdict.

    BankHandle:
      name: bank_handle
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9-]{2,20}$'
        example: andalus
      description: Bank handle as registered in the OpenWave registry

    LoginChallengeId:
      name: challenge_id
      in: path
      required: true
      schema:
        type: string
      description: Opaque five-minute bank-app login challenge identifier.

  schemas:

    HandleAvailabilityStatus:
      type: string
      description: Typed reason a handle can or cannot be claimed.
      enum: [AVAILABLE, TAKEN, RETIRED, INVALID]

    HandleAvailabilityResponse:
      type: object
      required: [handle, status, available]
      properties:
        handle:
          type: string
          description: Candidate normalized by trimming and lowercasing.
          example: ahmed.ali
        status:
          $ref: '#/components/schemas/HandleAvailabilityStatus'
        available:
          type: boolean
          description: True only when status is `AVAILABLE`.

    RenameHandleRequest:
      type: object
      description: |
        Runtime-canonical JSON uses camelCase. The shipped Identity service also
        accepts the legacy aliases `new_handle` and `national_id` on input only.
      required: [newHandle, nationalId]
      properties:
        newHandle:
          type: string
          pattern: '^[a-z0-9_.-]{3,32}$'
          description: New global handle. Lowercase letters, numbers, dots, underscores, or hyphens; 3-32 characters.
          example: ahmed.ali
        nationalId:
          type: string
          pattern: '^[0-9]{12}$'
          description: National ID used to verify that the calling bank is renaming the correct identity.
          example: "123456789012"

    IdentityRenameResponse:
      type: object
      description: |
        The shipped Identity DTO serializes this operation in camelCase. On a
        changed rename, `retiredHandle`, `reauthenticationRequired`, and `nextStep`
        are present. They are absent on an idempotent same-name retry. The new
        handle appears only in this authenticated success response; resolving the
        retired address never discloses it.
      required:
        - nptHandle
        - displayName
        - status
        - linkedBanks
        - nationalIdPresent
        - customerPortalAccess
        - createdAt
        - updatedAt
      properties:
        nptHandle:
          type: string
          example: ahmed.ali
        displayName:
          type: string
          example: Ahmed Ali
        status:
          type: string
          enum: [ACTIVE, SUSPENDED, DELETED]
        defaultBankHandle:
          type: string
          nullable: true
          example: andalus
        linkedBanks:
          type: array
          items: { type: string }
          example: [andalus, nub]
        nationalIdPresent:
          type: boolean
        customerPortalAccess:
          $ref: '#/components/schemas/CustomerPortalAccessResponse'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        retiredHandle:
          type: string
          description: Previous handle, permanently retired by this changed rename.
          example: ahmed
        reauthenticationRequired:
          type: boolean
          enum: [true]
          description: Existing portal sessions and delegated authorization cannot continue under the old subject.
        nextStep:
          type: string
          description: Customer must sign in with the new handle and re-authorize delegated applications.

    CustomerPortalAccessResponse:
      type: object
      nullable: true
      required: [username, userCreated, emailConfigured, passwordSetupLinkIssued, nextStep]
      properties:
        username: { type: string }
        userCreated: { type: boolean }
        emailConfigured: { type: boolean }
        passwordSetupLinkIssued: { type: boolean }
        nextStep: { type: string }

    PortalLoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          description: Global NPT username, phone number, national ID, or role-specific portal login.
        password:
          type: string
          format: password
          description: OpenWave Identity portal password, never a bank-app credential.
        role:
          type: string
          default: ADMIN
          enum: [ADMIN, BANK, CUSTOMER]

    PortalSessionResponse:
      type: object
      required: [role, username, portalRole, sessionToken, expiresIn]
      properties:
        role: { type: string, enum: [ADMIN, BANK, CUSTOMER] }
        username: { type: string }
        bankHandle: { type: string, nullable: true }
        portalRole: { type: string }
        sessionToken: { type: string }
        expiresIn: { type: integer, format: int64 }

    TotpLoginChallengeResponse:
      type: object
      required: [mfa_required, mfa_method, challenge_id, expires_in, role, username, portalRole]
      properties:
        mfa_required: { type: boolean, enum: [true] }
        mfa_method: { type: string, enum: [TOTP] }
        challenge_id: { type: string }
        expires_in: { type: integer, format: int64, example: 300 }
        role: { type: string, enum: [ADMIN, BANK, CUSTOMER] }
        username: { type: string }
        bankHandle: { type: string, nullable: true }
        portalRole: { type: string }

    TotpLoginVerifyRequest:
      type: object
      required: [challengeId, code]
      properties:
        challengeId: { type: string }
        code: { type: string }

    TotpLoginErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string }

    RoleMismatchResponse:
      type: object
      required: [code, message, expectedRole, portalRole, username]
      properties:
        code: { type: string, enum: [ROLE_MISMATCH] }
        message: { type: string }
        expectedRole: { type: string, enum: [ADMIN, BANK, CUSTOMER] }
        portalRole: { type: string }
        username: { type: string }

    BankLoginChoice:
      type: object
      required: [bankHandle, alias, isDefault]
      properties:
        bankHandle: { type: string, example: andalus }
        alias: { type: string, example: ahmed@andalus }
        isDefault: { type: boolean }

    BankAppLoginChallengeResponse:
      type: object
      required:
        - mfa_required
        - mfa_method
        - challenge_id
        - status_token
        - expires_in
        - identifier_type
        - identifier_hint
        - banks
        - role
        - username
        - portalRole
        - message
      properties:
        mfa_required: { type: boolean, enum: [true] }
        mfa_method: { type: string, enum: [BANK_APP] }
        challenge_id: { type: string }
        status_token:
          type: string
          description: Secret polling token for the initiating portal; do not send it to the bank app.
        expires_in: { type: integer, format: int64, example: 300 }
        identifier_type: { type: string, enum: [PHONE, NATIONAL_ID] }
        identifier_hint: { type: string, example: "***0020" }
        default_bank_handle: { type: string, nullable: true, example: andalus }
        banks:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/BankLoginChoice'
        role: { type: string, enum: [CUSTOMER] }
        username: { type: string, example: ahmed }
        portalRole: { type: string, example: CUSTOMER }
        message: { type: string }

    LoginApprovalStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED, EXPIRED]

    BankLoginApprovalStatusResponse:
      type: object
      required: [challenge_id, status, expires_in, bank_handle, session]
      properties:
        challenge_id: { type: string }
        status:
          $ref: '#/components/schemas/LoginApprovalStatus'
        expires_in: { type: integer, format: int64, minimum: 0 }
        bank_handle: { type: string, nullable: true }
        session:
          type: object
          nullable: true
          required: [role, username, portalRole, sessionToken, expiresIn]
          properties:
            role: { type: string, enum: [CUSTOMER] }
            username: { type: string }
            bankHandle: { type: string, nullable: true }
            portalRole: { type: string, enum: [CUSTOMER] }
            sessionToken: { type: string }
            expiresIn: { type: integer, format: int64 }

    BankLoginApprovalQueueItem:
      type: object
      required:
        - challenge_id
        - status
        - identifier_type
        - identifier_hint
        - requested_alias
        - created_at
        - expires_at
      properties:
        challenge_id: { type: string }
        status:
          $ref: '#/components/schemas/LoginApprovalStatus'
        identifier_type: { type: string, enum: [PHONE, NATIONAL_ID] }
        identifier_hint: { type: string }
        requested_alias: { type: string }
        default_bank_handle: { type: string, nullable: true }
        bank_customer_ref: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        actioned_at: { type: string, format: date-time, nullable: true }

    BankLoginApprovalSummary:
      type: object
      required: [total, pending, approved, rejected, expired]
      properties:
        total: { type: integer }
        pending: { type: integer }
        approved: { type: integer }
        rejected: { type: integer }
        expired: { type: integer }

    BankLoginApprovalListResponse:
      type: object
      required: [items, summary, limit]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BankLoginApprovalQueueItem'
        summary:
          $ref: '#/components/schemas/BankLoginApprovalSummary'
        limit: { type: integer, minimum: 1, maximum: 100 }

    BankLoginApprovalActionRequest:
      type: object
      required: [customerRef]
      properties:
        customerRef:
          type: string
          description: Internal customer reference authenticated by the calling bank.

    BankLoginApprovalActionResponse:
      type: object
      required: [challenge_id, status, expires_in, bank_handle]
      properties:
        challenge_id: { type: string }
        status: { type: string, enum: [APPROVED, REJECTED] }
        expires_in: { type: integer, format: int64, minimum: 0 }
        bank_handle: { type: string }

    LoginApprovalInvalidFilterErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            code: { type: string, enum: [LOGIN_APPROVAL_INVALID_FILTER] }

    LoginApprovalNotFoundErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            code: { type: string, enum: [LOGIN_APPROVAL_NOT_FOUND] }

    LoginApprovalNotPermittedErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            code: { type: string, enum: [LOGIN_APPROVAL_NOT_PERMITTED] }

    LoginApprovalAlreadyActionedErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            code: { type: string, enum: [LOGIN_APPROVAL_ALREADY_ACTIONED] }

    LoginApprovalExpiredErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            code: { type: string, enum: [LOGIN_APPROVAL_EXPIRED] }

    HandleValidationErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            code:
              type: string
              enum: [VALIDATION_ERROR]

    HandleRenameNotPermittedErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            code:
              type: string
              enum: [HANDLE_RENAME_NOT_PERMITTED]

    HandleRenameNotFoundErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            code:
              type: string
              enum: [IDENTITY_NOT_FOUND, BANK_NOT_REGISTERED]

    HandleTakenErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            code:
              type: string
              enum: [HANDLE_TAKEN]

    HandleRetiredErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            code:
              type: string
              enum: [HANDLE_RETIRED]

    HandleRenameTooSoonErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            code:
              type: string
              enum: [HANDLE_RENAME_TOO_SOON]

    AliasResolution:
      type: object
      required: [npt_handle, bank_handle, iban, display_name, is_default, resolved_at]
      properties:
        npt_handle:
          type: string
          description: The base username (without @bank)
          example: mtellesy
        bank_handle:
          type: string
          description: The bank this resolved to
          example: andalus
        iban:
          type: string
          description: Full IBAN for payment routing
          example: LY83002700100099900001
        display_name:
          type: string
          description: User-chosen display name (safe to show to sender for confirmation)
          example: Mohamed T.
        account_type:
          type: string
          enum: [CURRENT, SAVINGS]
          example: CURRENT
        is_default:
          type: boolean
          description: Whether this is the user's default account
        resolved_at:
          type: string
          format: date-time

    ClaimHandleRequest:
      type: object
      required: [npt_handle, bank_handle, iban, customer_display_name, bank_customer_ref]
      properties:
        npt_handle:
          type: string
          pattern: '^[a-z0-9_.-]{3,32}$'
          description: Desired handle. Lowercase alphanumeric, dots, underscores, hyphens. 3-32 chars.
          example: mtellesy
        bank_handle:
          type: string
          description: The claiming bank's registered handle
          example: andalus
        iban:
          type: string
          description: IBAN of the customer's account at this bank
          example: LY83002700100099900001
        customer_display_name:
          type: string
          description: |
            Display name shown to senders for payment confirmation.
            Should be the customer's real name or preferred display name.
            The registry does NOT store full KYC name — just this display label.
          example: Mohamed T.
        bank_customer_ref:
          type: string
          description: |
            Bank's internal customer reference. Stored privately for dispute resolution.
            Never returned in public API responses.
          example: CUST-00012345
        set_as_default:
          type: boolean
          default: true
          description: Whether this account should be the default. True for first claim.

    LinkAccountRequest:
      type: object
      required: [bank_handle, iban, bank_customer_ref]
      properties:
        bank_handle:
          type: string
          example: nub
        iban:
          type: string
          example: LY27003400200088800002
        bank_customer_ref:
          type: string
          example: NUB-CUST-9988
        set_as_default:
          type: boolean
          default: false

    LinkedAccount:
      type: object
      properties:
        bank_handle:
          type: string
          example: andalus
        iban_masked:
          type: string
          description: IBAN with middle digits masked
          example: LY8300...0001
        is_default:
          type: boolean
        linked_at:
          type: string
          format: date-time

    IdentityProfile:
      type: object
      properties:
        npt_handle:
          type: string
          example: mtellesy
        display_name:
          type: string
          example: Mohamed T.
        status:
          type: string
          enum: [ACTIVE, SUSPENDED, DELETED]
        default_bank_handle:
          type: string
          example: andalus
        linked_banks:
          type: array
          items:
            type: string
          example: [andalus, nub]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    IdentityPublicProfile:
      type: object
      description: Public-facing profile. Contains no IBANs or sensitive data.
      properties:
        npt_handle:
          type: string
          example: mtellesy
        display_name:
          type: string
          example: Mohamed T.
        has_default:
          type: boolean
          description: Whether a default account is set
        linked_bank_count:
          type: integer
          description: Number of linked banks (not the bank names)
          example: 2
        status:
          type: string
          enum: [ACTIVE, SUSPENDED]

    BankRegistration:
      type: object
      properties:
        bank_handle:
          type: string
          example: andalus
        display_name:
          type: string
          example: Andalus Bank
        country:
          type: string
          example: LY
        core_url:
          type: string
          format: uri
          example: https://api.andalus.ly
        active:
          type: boolean
        registered_at:
          type: string
          format: date-time

    RegisterBankRequest:
      type: object
      required: [bank_handle, display_name, country, core_url, contact_email]
      properties:
        bank_handle:
          type: string
          pattern: '^[a-z0-9-]{2,20}$'
          example: andalus
        display_name:
          type: string
          example: Andalus Bank
        country:
          type: string
          description: ISO 3166-1 alpha-2
          example: LY
        core_url:
          type: string
          format: uri
          example: https://api.andalus.ly
        contact_email:
          type: string
          format: email
          example: openwave@andalus.ly

    BankRegistrationResult:
      type: object
      properties:
        bank_handle:
          type: string
        display_name:
          type: string
        bank_api_key:
          type: string
          description: |
            The `X-OpenWave-Bank-Key` value issued to this bank.
            Shown ONCE — store it securely. Cannot be retrieved again.
          example: owbk_live_andalus_a1b2c3d4e5f6...
        registered_at:
          type: string
          format: date-time

    RegistryInfo:
      type: object
      properties:
        spec_version:
          type: string
        operator:
          type: string
        operator_url:
          type: string
          format: uri
        governance_charter_url:
          type: string
          format: uri
        source_code_url:
          type: string
          format: uri
        registered_banks:
          type: integer
        active_identities:
          type: integer
        uptime_sla:
          type: string
        country_scope:
          type: string
        future_operator:
          type: string

    NidLookupResponse:
      type: object
      description: Result of a national-ID-based KYC identity lookup
      properties:
        npt_handle:
          type: string
          description: The existing NPT username for this national ID (e.g. "mtellesy")
        national_id:
          type: string
        enrolled_banks:
          type: array
          items:
            type: object
            properties:
              bank_handle: { type: string }
              is_active: { type: boolean }
        customer_phone:
          type: string

    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Machine-readable error code
          enum:
            - IDENTITY_NOT_FOUND
            - HANDLE_TAKEN
            - HANDLE_RETIRED
            - HANDLE_INVALID_FORMAT
            - HANDLE_RENAME_NOT_PERMITTED
            - HANDLE_RENAME_TOO_SOON
            - LOGIN_APPROVAL_INVALID_FILTER
            - LOGIN_APPROVAL_NOT_FOUND
            - LOGIN_APPROVAL_NOT_PERMITTED
            - LOGIN_APPROVAL_ALREADY_ACTIONED
            - LOGIN_APPROVAL_EXPIRED
            - VALIDATION_ERROR
            - ACCOUNT_ALREADY_LINKED
            - ACCOUNT_NOT_FOUND
            - BANK_NOT_REGISTERED
            - BANK_HANDLE_TAKEN
            - UNAUTHORIZED
            - FORBIDDEN
            - RATE_LIMITED
            - REGISTRY_UNAVAILABLE
        message:
          type: string
          description: Human-readable error description
        details:
          type: object
          additionalProperties: true
          description: Optional additional context
